# Docker Compose reference for wordpress-sqlite.
#
# Usage:
#   docker compose up -d
#   # open http://localhost:8080 and finish the WordPress installer
#
# Single container, no MySQL service needed: WordPress stores everything in
# a local SQLite database under /var/www/sqlite/ — outside the web-accessible
# docroot, so the database file can never be downloaded over HTTP.
#
# The version key is intentionally omitted (compose is a file-format spec
# now; modern Docker Compose warns when "version" is set).

services:
  wordpress:
    image: ghcr.io/idealisan/container-images/wordpress-sqlite:latest
    container_name: wordpress-sqlite
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Persist the WordPress install (site files, uploads, plugins).
      - wp_data:/var/www/html
      # Persist the SQLite database separately, outside the docroot.
      - sqlite_data:/var/www/sqlite
    environment:
      # All upstream WORDPRESS_* variables work (all optional here):
      - WORDPRESS_TABLE_PREFIX=wp_
      # NOTE: the upstream wp-config template does !!getenv_docker('WORDPRESS_DEBUG'),
      # so ANY non-empty value — including "0" — turns WP_DEBUG on. Leave it
      # unset (or empty) for production; set "1" to enable debugging:
      # - WORDPRESS_DEBUG=1
      # Custom SQLite location (optional; the defaults are shown):
      # - WORDPRESS_DB_DIR=/var/www/sqlite/
      # - WORDPRESS_DB_FILE=.ht.sqlite
      # Override the auto-generated secret keys/salts (optional but
      # recommended for stable installs):
      - WORDPRESS_AUTH_KEY=change-me
      - WORDPRESS_SECURE_AUTH_KEY=change-me
      - WORDPRESS_LOGGED_IN_KEY=change-me
      - WORDPRESS_NONCE_KEY=change-me
      - WORDPRESS_AUTH_SALT=change-me
      - WORDPRESS_SECURE_AUTH_SALT=change-me
      - WORDPRESS_LOGGED_IN_SALT=change-me
      - WORDPRESS_NONCE_SALT=change-me
    healthcheck:
      # The official wordpress image does not ship the `curl` CLI, so probe
      # with PHP (always present) instead:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1/\") === false ? 1 : 0);'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  wp_data:
  sqlite_data: