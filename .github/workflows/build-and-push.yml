name: Build and push images

# Triggers on every published release AND pre-release.
# The GitHub `release` event with `types: [published]` fires for both
# regular releases and pre-releases, so this single trigger covers both.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Discover every image directory (any dir that contains an image.yaml).
  discover:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.dirs.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - id: dirs
        run: |
          dirs=$(find . -name image.yaml -not -path './.git/*' \
            | sed -E 's#/image.yaml$##; s#^\./##' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "images=$dirs" >> "$GITHUB_OUTPUT"
          echo "Discovered images: $dirs"

  # Build each image for both architectures and push single-arch images.
  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every image in this repo is built and published for both arches.
        image: ${{ fromJson(needs.discover.outputs.images) }}
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image reference
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_ENV"

      # --- Build the LXC/Incus rootfs with distrobuilder -------------------
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install distrobuilder and build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap rsync gnupg squashfs-tools qemu-user-static
          go install github.com/lxc/distrobuilder/cmd/distrobuilder@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build rootfs (${{ matrix.arch }})
        run: |
          cd "${{ matrix.image }}"
          # Pin the architecture in the config to the matrix value so the
          # debootstrap step produces the right arch rootfs (cross-arch builds
          # for arm64 run under qemu-user-static registered by the package).
          sed -i -E "s/^  architecture: .*/  architecture: ${{ matrix.arch }}/" image.yaml
          distrobuilder build-incus image.yaml --arch ${{ matrix.arch }}

      # --- Wrap the rootfs as an OCI image and push (single arch) ----------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Make entrypoint executable
        run: chmod +x "${{ matrix.image }}/entrypoint.sh"

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          # Temporary per-arch tag; the merge job combines them into the
          # final multi-arch manifest.
          tags: ${{ env.IMAGE }}:build-${{ github.sha }}-${{ matrix.arch }}
          provenance: false

  # Merge each image's two architectures into a single multi-arch manifest.
  merge:
    name: Merge ${{ matrix.image }}
    needs: [discover, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image reference
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # the release tag, e.g. v1.0.0
            type=ref,event=tag
            # latest only for stable (non-prerelease) releases
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
            # prerelease tag for pre-releases
            type=raw,value=prerelease,enable=${{ github.event.release.prerelease }}

      - name: Create multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          BASE="${{ env.IMAGE }}"
          SHA="${{ github.sha }}"
          for tag in $TAGS; do
            echo "Creating manifest: $tag"
            docker buildx imagetools create --tag "$tag" \
              "${BASE}:build-${SHA}-amd64" \
              "${BASE}:build-${SHA}-arm64"
          done
